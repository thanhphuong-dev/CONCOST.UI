name: Build & Test CONCOST.UI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore CONCOST.UI.sln

    - name: Build Solution
      run: dotnet build CONCOST.UI.sln --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test tests/CONCOST.UI.Tests/CONCOST.UI.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Create NuGet Package
      run: dotnet pack src/CONCOST.UI/CONCOST.UI.csproj --configuration Release --no-build --no-restore
