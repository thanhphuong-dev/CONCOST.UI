<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Không tìm thấy trang — CONCOST.UI</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff7900'/%3E%3Cpath d='M9 22V10h3.4v9.3H23V22z' fill='%23fff'/%3E%3C/svg%3E">
    <style>
        :root { --bg:#f7f8fa; --card:#fff; --text:#101828; --soft:#475467; --line:#e4e8ee; --accent:#b35200; }
        @media (prefers-color-scheme: dark) {
            :root { --bg:#0b0f17; --card:#121926; --text:#eef2f8; --soft:#a9b4c6; --line:#1e2938; --accent:#ff7900; }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
            background: var(--bg); color: var(--text);
            font-family: "Plus Jakarta Sans", system-ui, sans-serif; line-height: 1.6;
        }
        .card {
            max-width: 520px; width: 100%; background: var(--card); border: 1px solid var(--line);
            border-radius: 16px; padding: 32px; box-shadow: 0 20px 50px -30px rgba(16,24,40,.35);
        }
        .code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; letter-spacing: .6px; color: var(--accent); text-transform: uppercase; font-weight: 700; }
        h1 { margin: 8px 0 10px; font-size: 26px; letter-spacing: -.6px; }
        p { margin: 0 0 20px; color: var(--soft); font-size: 14.5px; }
        a.btn {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px;
            background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; font-size: 13.5px;
        }
        a.btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
        a.plain { color: var(--accent); font-weight: 600; }
    </style>
</head>
<body>
    <main class="card">
        <div class="code">404 · Not found</div>
        <h1>Không tìm thấy trang này</h1>
        <p>Đường dẫn bạn mở không tồn tại trong bộ tài liệu. Trang chủ wiki vẫn sẵn sàng — 80 trang, song ngữ Việt / Anh.</p>
        <a class="btn" href="./">← Về trang tài liệu</a>
        <p style="margin:18px 0 0;font-size:13px">
            Hoặc xem <a class="plain" href="./#examples">ví dụ sử dụng</a> ·
            <a class="plain" href="./?lang=en">English</a>
        </p>
    </main>
</body>
</html>
