<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONCOST.UI — Tài liệu kỹ thuật &amp; Design System</title>
    <meta name="description" content="Tài liệu đầy đủ cho thư viện WPF CONCOST.UI: hướng dẫn cài đặt, theme tokens, API tham chiếu và code inspector cho hơn 80 controls kỹ thuật CAD/BIM.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script>
        // Restore theme + accent before first paint to avoid a flash of the wrong palette.
        (function () {
            try {
                var qp = new URLSearchParams(location.search);
                var t = qp.get("theme") || localStorage.getItem("concost.theme");
                if (t) document.documentElement.setAttribute("data-theme", t);
                var a = localStorage.getItem("concost.accent");
                if (a) {
                    document.documentElement.style.setProperty("--accent", a);
                    document.documentElement.style.setProperty("--accent-soft", a + "1a");
                    document.documentElement.style.setProperty("--accent-line", a + "47");
                }
            } catch (e) { }
        })();
    </script>
</head>
<body>
    <header class="topbar">
        <button class="action-btn menu-toggle" id="menuToggle" aria-label="Mở menu">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="brand">
            <div class="logo-box"><i class="fa-solid fa-ruler-combined"></i></div>
            <div>
                <div class="brand-title">CONCOST<span>.UI</span> <span class="badge-ver" id="verBadge">v3.0</span></div>
                <div class="brand-sub">Engineering WPF Design System</div>
            </div>
        </div>

        <button class="search-trigger" id="searchTrigger">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Tìm control, token, hướng dẫn…</span>
            <kbd>Ctrl K</kbd>
        </button>

        <div class="header-actions">
            <div class="palette-picker" title="Accent color">
                <span class="palette-dot active" style="--c:#ff7900" data-color="#ff7900"></span>
                <span class="palette-dot" style="--c:#0284c7" data-color="#0284c7"></span>
                <span class="palette-dot" style="--c:#16a34a" data-color="#16a34a"></span>
                <span class="palette-dot" style="--c:#8b5cf6" data-color="#8b5cf6"></span>
                <span class="palette-dot" style="--c:#dc2626" data-color="#dc2626"></span>
            </div>
            <button id="themeToggleBtn" class="action-btn" title="Sáng / Tối">
                <i class="fa-solid fa-moon"></i>
            </button>
            <a href="https://github.com/thanhphuong-dev/CONCOST.UI" target="_blank" rel="noopener" class="action-btn" title="GitHub">
                <i class="fa-brands fa-github"></i>
            </a>
        </div>
    </header>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <nav id="sidebarNav"><!-- injected --></nav>
            <div class="sidebar-foot">
                <b>CONCOST.UI</b><br>
                Multi-target WPF · net48 / net8 / net10<br>
                <span id="footCount"></span>
            </div>
        </aside>

        <div class="content-shell">
            <main class="main-content" id="mainContent"><!-- injected --></main>
            <aside class="toc" id="toc"><!-- injected --></aside>
        </div>
    </div>

    <!-- Command palette -->
    <div class="cmdk-overlay" id="cmdkOverlay">
        <div class="cmdk" role="dialog" aria-modal="true">
            <div class="cmdk-input-row">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="cmdkInput" placeholder="Tìm control, thuộc tính, style key…" autocomplete="off" spellcheck="false">
                <kbd>ESC</kbd>
            </div>
            <div class="cmdk-results" id="cmdkResults"></div>
            <div class="cmdk-foot">
                <span><kbd>↑</kbd> <kbd>↓</kbd> di chuyển</span>
                <span><kbd>↵</kbd> mở</span>
                <span id="cmdkCount"></span>
            </div>
        </div>
    </div>

    <div class="toast-popup" id="toastNotification">
        <i class="fa-solid fa-circle-check"></i> <span id="toastText">Đã sao chép mã nguồn</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-csharp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>

    <script src="data/legacy.js"></script>
    <script src="data/guides.js"></script>
    <script src="data/custom.js"></script>
    <script src="data/basic.js"></script>
    <script src="data/enrich.js"></script>
    <script src="data/auto.generated.js"></script>
    <script src="data/nav.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
