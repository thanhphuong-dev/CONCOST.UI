    <script>
        // Restore theme + accent before first paint to avoid a flash of the wrong palette.
        (function () {
            try {
                var qp = new URLSearchParams(location.search);
                var t = qp.get("theme") || localStorage.getItem("concost.theme");
                if (t) document.documentElement.setAttribute("data-theme", t);
                var a = localStorage.getItem("concost.accent");
                if (a) {
                    var ink = { "#ff7900": "#b35200", "#0284c7": "#0d6ba6", "#16a34a": "#0f6b32",
                                "#8b5cf6": "#6a3fd4", "#dc2626": "#a81c1c" };
                    document.documentElement.style.setProperty("--accent", a);
                    document.documentElement.style.setProperty("--accent-soft", a + "1a");
                    document.documentElement.style.setProperty("--accent-line", a + "47");
                    if (ink[a]) document.documentElement.style.setProperty("--accent-strong", ink[a]);
                }
            } catch (e) { }
        })();
    </script>
